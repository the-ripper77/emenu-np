<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; margin: 0; padding: 40px 20px; }
        .container { max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 40px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .logo { text-align: center; margin-bottom: 24px; }
        .logo h1 { color: #333; font-size: 24px; margin: 0; }
        .code { text-align: center; margin: 32px 0; }
        .code span { display: inline-block; background: #f0f0f0; border-radius: 8px; padding: 16px 32px; font-size: 32px; font-weight: bold; letter-spacing: 8px; color: #333; font-family: monospace; }
        .message { color: #666; font-size: 14px; line-height: 1.6; text-align: center; }
        .footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid #eee; color: #999; font-size: 12px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>eMenu</h1>
        </div>
        <div class="message">
            <p>You requested to <strong>{{purpose}}</strong>.</p>
            <p>Use the verification code below:</p>
        </div>
        <div class="code">
            <span>{{code}}</span>
        </div>
        <div class="message">
            <p>This code expires in {{expire_minutes}} minutes.</p>
            <p>If you didn't request this, you can safely ignore this email.</p>
        </div>
        <div class="footer">
            <p>eMenu &mdash; Digital Menu & Ordering System</p>
        </div>
    </div>
</body>
</html>
